<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos de Box Level</title>
    <style>
        h1 {
            background-color: lightgrey;
            height: 300px;
            width: 300px;

            border: 25px solid darkslategray;

            padding: 15px;

            margin: 20px auto;

            outline: 5px dashed salmon;
        }
        a {
            border: 10px solid darkslategray;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa Box-Level</h1>
    <p>
        Parágrafos também são exeplos de box-level,mas os <a href="#">links são exeplos de caixas inline-level.</a> Vamos ver como isso funciona?
    </p>
</body>
</html>
